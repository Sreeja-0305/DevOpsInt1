<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4f6fb">
  <title>Sign in | Northstar</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="login-page">
    <section class="login-card" aria-labelledby="page-title">
      <a class="brand" href="#" aria-label="Northstar home">
        <span class="brand-mark" aria-hidden="true">N</span>
        <span>northstar</span>
      </a>

      <div class="welcome">
        <p class="eyebrow">WELCOME BACK</p>
        <h1 id="page-title">Sign in to your account</h1>
        <p class="subtitle">Enter your details below to continue.</p>
      </div>

      <form class="login-form" action="#" method="post">
        <div class="field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
        </div>

        <div class="field">
          <div class="label-row">
            <label for="password">Password</label>
            <a class="text-link" href="#forgot-password">Forgot password?</a>
          </div>
          <input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
        </div>

        <label class="remember-option">
          <input type="checkbox" name="remember-me">
          <span>Remember me</span>
        </label>

        <button class="submit-button" type="submit">Sign in <span aria-hidden="true">→</span></button>
      </form>

      <p class="signup-prompt">Don't have an account? <a class="text-link" href="#sign-up">Create one</a></p>
      <p class="security-note"><span aria-hidden="true">◆</span> Your information is securely encrypted</p>
    </section>
  </main>
</body>
</html>
